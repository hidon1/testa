<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ניהול שוק ארבעת המינים</title>
<meta name="theme-color" content="#153b2a">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<link rel="shortcut icon" href="favicon.svg?v=1">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--green:#153b2a;--green2:#256846;--gold:#d9ad38;--gold2:#f2d36f;--ink:#193126;--muted:#6b7b72;--line:#dfe9e2;--red:#b42323;--ok:#16834a;--okBg:#eaf8ef;--orange:#a6630e;--orangeBg:#fff6df;--blue:#2f6e9d;--shadow:0 10px 30px rgba(21,59,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Heebo,Arial,sans-serif;color:var(--ink);background:#f5f8f5;min-height:100vh}.wrap{width:min(1580px,96%);margin:auto;padding:12px 0 28px}
header{margin:0 0 12px;background:linear-gradient(135deg,#123822,#1d5b3d 68%,#7e641c);color:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 8px 24px rgba(21,59,42,.12)}.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;min-width:235px}.brand-mark{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:linear-gradient(145deg,#f4dc83,#bd8d1d);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 5px 12px rgba(0,0,0,.16)}.brand-mark svg{width:30px;height:30px}.title h1{margin:0;font-family:'Frank Ruhl Libre',serif;color:#fff8d5;font-size:1.28rem;line-height:1.05}.title p{margin:3px 0 0;color:#dcebe1;font-size:.78rem}.product-pill{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);padding:7px 10px;border-radius:12px;font-size:.8rem}.product-pill strong{color:#ffe58b}.sku{font-weight:900}.price-chip{font-size:1.05rem;font-weight:900;color:#fff8d4}.header-actions,.table-actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:8px 11px;font:inherit;font-size:.84rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.18s ease}.btn:hover{transform:translateY(-1px)}.btn-primary{background:linear-gradient(135deg,#f0cf64,#c99720);color:#193126}.btn-secondary{background:#edf3ee;color:var(--green)}.btn-ghost{background:#fff;color:var(--green);border:1px solid var(--line)}.btn-excel{background:#eaf7ee;color:#116b39;border:1px solid #bfe0ca}.btn-save{background:linear-gradient(135deg,#1d7549,#124b30);color:#fff}.btn-danger{background:#fff0f0;color:#a71818;border:1px solid #efb7b7}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:10px}.stat{background:#fff;border:1px solid rgba(45,123,82,.12);border-radius:15px;padding:11px 13px;box-shadow:var(--shadow);min-height:78px}.stat .label{color:var(--muted);font-weight:700;font-size:.76rem}.stat .value{margin-top:2px;font-size:1.45rem;font-weight:900;line-height:1.1}.stat.paid .value{color:var(--ok)}.stat.unpaid .value{color:var(--red)}.stat.today .value{color:var(--blue)}
.product-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px}.product-stat{appearance:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid rgba(45,123,82,.14);border-radius:15px;background:#fff;box-shadow:var(--shadow);font:inherit;text-align:right;cursor:pointer;transition:.18s ease}.product-stat:hover,.product-stat.active{transform:translateY(-1px);border-color:#d0a52f}.product-stat.active{background:linear-gradient(135deg,#fffdf4,#f5edc8)}.product-stat-name{display:grid;gap:1px;font-weight:900;color:var(--green);font-size:.9rem}.product-stat-name small{font-size:.69rem;font-weight:700;color:var(--muted)}.product-stat-value{min-width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--green);color:#ffe47d;font-size:1.15rem;font-weight:900}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;display:grid;grid-template-columns:minmax(240px,2fr) repeat(3,minmax(140px,1fr)) auto;gap:9px;align-items:end;margin-bottom:10px;box-shadow:var(--shadow)}.field{display:grid;gap:4px}.field label{font-size:.75rem;color:var(--muted);font-weight:800}.control{width:100%;border:1px solid #cedbd1;border-radius:10px;background:#fbfdfb;padding:8px 10px;font:inherit;font-size:.88rem;outline:none}.control:focus{border-color:#7eaa8c;box-shadow:0 0 0 3px rgba(37,104,70,.08)}
.table-card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.table-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}.table-head h2{margin:0;font-size:1.08rem}.mini{font-size:.72rem;color:var(--muted)}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1280px;font-size:.84rem}th{background:#edf5ef;padding:9px 8px;text-align:right;white-space:nowrap;font-size:.76rem}td{padding:9px 8px;border-bottom:1px solid #edf2ee;vertical-align:middle}tbody tr:hover{background:#fbfdfb}.receipt-number{display:inline-flex;padding:5px 8px;border-radius:999px;background:#153b2a;color:#fff;font-weight:900;font-size:.75rem}.receipt-number.no-receipt{background:#eef3ef;color:#4b6155}.receipt-order-id{margin-top:3px;color:var(--muted);font-size:.67rem}.money{font-weight:900;color:var(--green2)}.badge{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:.72rem;font-weight:900}.badge.pickup{background:#eef3ef;color:#40564a}.badge.delivery{background:#edf7ff;color:#20618e}.pay-state{display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:6px 8px;font-size:.72rem;font-weight:900}.pay-state.paid{background:var(--okBg);color:var(--ok)}.pay-state.pending{background:var(--orangeBg);color:var(--orange)}.payment-attempt-note{display:block;margin-top:4px;color:#a6630e;font-size:.68rem;font-weight:800}.product-lines{display:grid;gap:4px;min-width:180px}.product-line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 7px;border-radius:8px;background:#f4f8f5;color:#294b39;font-size:.75rem;font-weight:700}.product-line strong{color:var(--green)}.row-actions{display:flex;gap:5px;align-items:center}.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--green)}.row-delete-btn{padding:6px 8px;border:1px solid #efc3c3;border-radius:9px;background:#fff3f3;color:#a71818;font:inherit;font-size:.72rem;font-weight:900;cursor:pointer;white-space:nowrap}.empty{text-align:center!important;padding:44px!important;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(7,25,16,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.modal.active{display:flex}.modal-card{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:1.15rem}.close-btn{width:34px;height:34px;border:0;border-radius:10px;background:#eff5f0;font-size:1.2rem}.form-body{padding:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.form-footer{display:flex;gap:8px;padding-top:15px}.checkline{display:flex;align-items:center;gap:8px;padding:9px 10px;background:#f4f8f5;border-radius:10px}.summary-box{grid-column:1/-1;background:#f6fbf7;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between}.product-qty-wrap{grid-column:1/-1}.product-qty-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.product-qty-card{display:grid;gap:5px;padding:9px;border:1px solid var(--line);border-radius:11px;background:#f8fbf8;color:var(--green);font-weight:800;font-size:.8rem}.product-qty-card input{text-align:center}.unknown-items-note{display:none;grid-column:1/-1;padding:9px 10px;border-radius:10px;background:#fff6df;color:#85520f;font-size:.76rem}.unknown-items-note.visible{display:block}.toast{position:fixed;left:18px;bottom:18px;background:#163b2a;color:#fff;border-radius:11px;padding:10px 13px;display:none;z-index:10000;font-size:.84rem}.toast.show{display:block}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr}.product-summary{grid-template-columns:repeat(3,1fr)}.product-pill{display:none}}
@media(max-width:680px){.wrap{width:min(100% - 16px,1580px)}header{border-radius:14px;padding:9px 10px}.brand{min-width:0}.brand-mark{width:38px;height:38px;flex-basis:38px}.title h1{font-size:1.08rem}.title p{display:none}.header-actions{width:100%}.header-actions .btn{flex:1;min-width:120px}.stats{grid-template-columns:1fr 1fr}.product-summary{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.form-grid,.product-qty-grid{grid-template-columns:1fr}.full,.summary-box,.product-qty-wrap{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="header-row">
<div class="brand">
<div class="brand-mark" aria-hidden="true">
<svg viewBox="0 0 64 64"><path d="M17 18v30M47 18v30M14 48h36" fill="none" stroke="#153b2a" stroke-width="4" stroke-linecap="round"/><path d="M12 18h40M15 13h34" fill="none" stroke="#2f764d" stroke-width="4" stroke-linecap="round"/><path d="M34 25v21m0-13-7 6m7-3 7 6" fill="none" stroke="#2f764d" stroke-width="3" stroke-linecap="round"/><ellipse cx="26" cy="40" rx="6" ry="8" fill="#fff4a8" stroke="#8f6710" stroke-width="2"/></svg>
</div>
<div class="title"><h1>ניהול שוק ארבעת המינים</h1><p>הזמנות, תשלומים ולקוחות במקום אחד</p></div>
</div>
<div class="product-pill"><div><div class="sku">3 סוגי סטים</div><strong>ספרדי · אשכנזי · תימני</strong></div><div class="price-chip">₪130</div></div>
<div class="header-actions">
<button class="btn btn-primary" onclick="openNewOrder()"><i class="fa-solid fa-plus"></i> הזמנה חדשה</button>
<button class="btn btn-excel" onclick="exportExcel(true)"><i class="fa-solid fa-file-excel"></i> Excel</button>
<button class="btn btn-danger" id="resetAllBtn" onclick="resetAllOrders(this)"><i class="fa-solid fa-trash-can"></i> איפוס</button>
</div>
</div>
</header>
<section class="stats">
<div class="stat"><div class="label">סה״כ רשומות</div><div class="value" id="totalOrders">0</div></div>
<div class="stat today"><div class="label">היום</div><div class="value" id="todayOrders">0</div></div>
<div class="stat"><div class="label">סה״כ סטים</div><div class="value" id="totalUnits">0</div></div>
<div class="stat paid"><div class="label">שולם</div><div class="value" id="paidCount">0</div></div>
<div class="stat unpaid"><div class="label">ממתין לתשלום</div><div class="value" id="pendingCount">0</div></div>
</section>
<section class="product-summary" aria-label="סיכום לפי סוג סט">
<button type="button" class="product-stat" data-product-key="sef" onclick="setProductFilter('sef')"><span class="product-stat-name">סט ספרדי<small>מספר הסטים שהוזמנו</small></span><span class="product-stat-value" id="sefUnits">0</span></button>
<button type="button" class="product-stat" data-product-key="ash" onclick="setProductFilter('ash')"><span class="product-stat-name">סט אשכנזי<small>מספר הסטים שהוזמנו</small></span><span class="product-stat-value" id="ashUnits">0</span></button>
<button type="button" class="product-stat" data-product-key="yem" onclick="setProductFilter('yem')"><span class="product-stat-name">סט עם אתרוג תימני<small>מספר הסטים שהוזמנו</small></span><span class="product-stat-value" id="yemUnits">0</span></button>
</section>
<section class="toolbar">
<div class="field"><label>חיפוש</label><input id="search" class="control" placeholder="שם, טלפון, אימייל, עיר או מספר הזמנה" oninput="render()"></div>
<div class="field"><label>סטטוס תשלום</label><select id="paymentFilter" class="control" onchange="render()"><option value="all">הכול</option><option value="paid">שולם</option><option value="pending">ממתין</option></select></div>
<div class="field"><label>סוג סט</label><select id="productFilter" class="control" onchange="render()"><option value="all">כל הסטים</option><option value="sef">סט ספרדי</option><option value="ash">סט אשכנזי</option><option value="yem">סט עם אתרוג תימני</option></select></div>
<div class="field"><label>אופן קבלה</label><select id="shippingFilter" class="control" onchange="render()"><option value="all">הכול</option><option value="איסוף עצמי">איסוף עצמי</option><option value="משלוח">משלוח</option></select></div>
<button class="btn btn-secondary" onclick="clearFilters()">ניקוי</button>
</section>
<section class="table-card">
<div class="table-head"><div><h2>הזמנות</h2><div class="mini" id="visibleCount">מציג 0</div></div><div class="table-actions"><button class="btn btn-excel" onclick="exportExcel(false)"><i class="fa-solid fa-file-excel"></i> Excel לפי החיפוש</button><button class="btn btn-ghost" onclick="openNewOrder()">הזמנה חדשה</button></div></div>
<div class="table-scroll"><table><thead><tr><th>מס׳ קבלה / הזמנה</th><th>תאריך</th><th>לקוח</th><th>טלפון</th><th>כמות</th><th>סוג הסט</th><th>קבלה</th><th>סכום</th><th>סטטוס תשלום</th><th>הערות</th><th>פעולות</th></tr></thead><tbody id="ordersBody"><tr><td class="empty" colspan="11">טוען הזמנות...</td></tr></tbody></table></div>
</section>
</div>
<div class="modal" id="orderModal" onclick="if(event.target===this)closeOrderModal()"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">הזמנה חדשה</h2><button class="close-btn" onclick="closeOrderModal()">×</button></div><form id="orderForm" class="form-body" onsubmit="saveOrder(event)"><input type="hidden" id="editDocId"><input type="hidden" id="editOrderId"><div class="form-grid">
<div class="field"><label>שם לקוח *</label><input id="fName" class="control" required></div><div class="field"><label>טלפון *</label><input id="fPhone" class="control" required></div><div class="field"><label>אימייל</label><input id="fEmail" type="email" class="control"></div>
<div class="field product-qty-wrap"><label>כמות לפי סוג סט *</label><div class="product-qty-grid"><label class="product-qty-card">סט ספרדי<input id="fQtySef" type="number" min="0" value="1" class="control" oninput="refreshFormTotal()"></label><label class="product-qty-card">סט אשכנזי<input id="fQtyAsh" type="number" min="0" value="0" class="control" oninput="refreshFormTotal()"></label><label class="product-qty-card">סט עם אתרוג תימני<input id="fQtyYem" type="number" min="0" value="0" class="control" oninput="refreshFormTotal()"></label></div></div>
<div class="field"><label>אופן קבלה</label><select id="fShipping" class="control" onchange="toggleAddress();refreshFormTotal()"><option value="איסוף עצמי">איסוף עצמי</option><option value="משלוח">משלוח (+₪45)</option></select></div><div class="field"><label>תאריך</label><input id="fDate" type="datetime-local" class="control"></div>
<div class="field address"><label>עיר</label><input id="fCity" class="control"></div><div class="field address"><label>רחוב</label><input id="fStreet" class="control"></div><div class="field address"><label>בית</label><input id="fHouse" class="control"></div><div class="field address"><label>דירה</label><input id="fApartment" class="control"></div>
<div class="field full"><label>הערות</label><textarea id="fNotes" class="control"></textarea></div><label class="checkline full"><input id="fPaid" type="checkbox"> ההזמנה שולמה</label><div class="unknown-items-note" id="unknownItemsNote"></div><div class="summary-box"><span>סכום ההזמנה</span><strong id="formTotal">₪130</strong></div></div><div class="form-footer"><button id="saveOrderBtn" type="submit" class="btn btn-save">שמירה</button><button type="button" class="btn btn-secondary" onclick="closeOrderModal()">ביטול</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="firebase-admin.js?v=20260914-1"></script>
<script src="admin.js?v=20260914-1" defer></script>
</body>
</html>
