<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ניהול שוק ארבעת המינים</title><meta name="theme-color" content="#153b2a"><link rel="icon" type="image/svg+xml" href="favicon.svg?v=1"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{--green:#153b2a;--green2:#256846;--gold:#d9ad38;--ink:#193126;--muted:#6b7b72;--line:#dfe9e2;--red:#b42323;--ok:#16834a;--okBg:#eaf8ef;--orange:#a6630e;--orangeBg:#fff6df;--blue:#2f6e9d;--shadow:0 10px 30px rgba(21,59,42,.08)}*{box-sizing:border-box}body{margin:0;font-family:Heebo,Arial,sans-serif;color:var(--ink);background:#f5f8f5;min-height:100vh}.wrap{width:min(1580px,96%);margin:auto;padding:12px 0 28px}header{margin:0 0 12px;background:linear-gradient(135deg,#123822,#1d5b3d 68%,#7e641c);color:#fff;border-radius:18px;padding:10px 14px;box-shadow:var(--shadow)}.header-row,.header-actions,.table-actions,.row-actions,.status-buttons,.delivery-actions,.delivery-card-top,.city-title{display:flex;align-items:center;gap:8px}.header-row,.delivery-card-top,.city-title{justify-content:space-between}.header-row{flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#f4dc83,#bd8d1d);display:grid;place-items:center}.brand-mark svg{width:30px}.title h1{margin:0;font-family:'Frank Ruhl Libre';color:#fff8d5;font-size:1.28rem}.title p{margin:3px 0 0;color:#dcebe1;font-size:.78rem}.product-pill{background:#ffffff18;padding:7px 10px;border-radius:12px;font-size:.8rem}.price-chip{font-weight:900}.btn{border:0;border-radius:10px;padding:8px 11px;font:inherit;font-size:.84rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}.btn-primary{background:linear-gradient(135deg,#f0cf64,#c99720);color:#193126}.btn-secondary{background:#edf3ee;color:var(--green)}.btn-ghost{background:#fff;color:var(--green);border:1px solid var(--line)}.btn-excel{background:#eaf7ee;color:#116b39;border:1px solid #bfe0ca}.btn-save,.btn-delivered{background:#176b42;color:#fff}.btn-danger{background:#fff0f0;color:#a71818}.btn-waze{background:#e7f8ff;color:#17617a;border:1px solid #b7e1ef}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:10px}.stat,.product-stat,.toolbar,.table-card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:11px 13px}.stat .label,.mini{color:var(--muted);font-size:.75rem}.stat .value{font-size:1.45rem;font-weight:900}.stat.paid .value{color:var(--ok)}.stat.unpaid .value{color:var(--red)}.product-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px}.product-stat{display:flex;justify-content:space-between;padding:11px 13px;font:inherit;cursor:pointer}.product-stat-name{font-weight:900}.product-stat-name small{display:block;color:var(--muted)}.product-stat-value{background:var(--green);color:#ffe47d;padding:7px 12px;border-radius:10px;font-weight:900}.toolbar{padding:10px;display:grid;grid-template-columns:minmax(240px,2fr) repeat(3,minmax(140px,1fr)) auto;gap:9px;align-items:end;margin-bottom:10px}.field{display:grid;gap:4px}.field label{font-size:.75rem;color:var(--muted);font-weight:800}.control{width:100%;border:1px solid #cedbd1;border-radius:10px;padding:8px 10px;font:inherit}.table-card{overflow:hidden}.table-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line)}.table-head h2{margin:0}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1280px;font-size:.84rem}th{background:#edf5ef;padding:9px 8px;text-align:right}td{padding:9px 8px;border-bottom:1px solid #edf2ee;vertical-align:middle}.receipt-number{display:inline-flex;padding:5px 8px;border-radius:999px;background:#153b2a;color:#fff;font-weight:900}.receipt-number.no-receipt{background:#eef3ef;color:#4b6155}.receipt-order-id{font-size:.67rem;color:var(--muted)}.money{font-weight:900}.badge,.pay-state,.delivery-state{display:inline-flex;border-radius:9px;padding:5px 8px;font-size:.72rem;font-weight:900}.badge.delivery{background:#edf7ff;color:#20618e}.badge.pickup{background:#eef3ef}.pay-state.paid{background:var(--okBg);color:var(--ok)}.pay-state.pending{background:var(--orangeBg);color:var(--orange)}.delivery-state.done{margin-top:5px;background:#e8f4ff;color:#235f8b}.status-buttons{margin-top:6px;flex-wrap:wrap}.status-buttons .btn{padding:5px 7px;font-size:.7rem}.product-lines{display:grid;gap:4px}.product-line{display:flex;justify-content:space-between;background:#f4f8f5;padding:5px 7px;border-radius:8px}.delivery-address-lines{font-size:.71rem;margin-top:5px;line-height:1.45}.waze-link{display:inline-flex;gap:4px;margin-top:4px;color:#16718d;font-weight:900;text-decoration:none}.icon-btn{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px}.row-delete-btn{padding:6px;border:1px solid #efc3c3;background:#fff3f3;color:#a71818;border-radius:9px}.empty{text-align:center;padding:40px;color:var(--muted)}.modal{position:fixed;inset:0;background:#07191094;display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.modal.active{display:flex}.modal-card{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px}.modal-head{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid var(--line)}.close-btn{border:0;background:#eff5f0;border-radius:9px;font-size:1.2rem}.form-body{padding:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full,.product-qty-wrap,.summary-box{grid-column:1/-1}.product-qty-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.product-qty-card{display:grid;padding:9px;background:#f8fbf8;border-radius:10px}.checkline,.summary-box{padding:9px;background:#f4f8f5;border-radius:10px}.form-footer{display:flex;gap:8px;padding-top:15px}.unknown-items-note{display:none}.unknown-items-note.visible{display:block}.toast{position:fixed;left:18px;bottom:18px;background:#163b2a;color:#fff;padding:10px;border-radius:10px;display:none;z-index:10000}.toast.show{display:block}.delivery-board-card{width:min(1300px,98%);height:min(92vh,900px);display:flex;flex-direction:column}.delivery-board-head{background:linear-gradient(135deg,#123822,#246946);color:#fff}.delivery-board-head h2{margin:0}.delivery-board-body{padding:14px;overflow:auto;background:#f5f8f5;flex:1}.city-group{margin-bottom:18px}.city-title{background:#153b2a;color:#fff;padding:10px 14px;border-radius:12px 12px 0 0}.city-title h3{margin:0}.delivery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;background:#edf3ee;padding:10px;border-radius:0 0 12px 12px}.delivery-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;box-shadow:0 4px 12px #153b2a0d}.delivery-card.delivered{opacity:.62}.delivery-card-top span{font-size:.72rem;background:#eef5ef;padding:4px 7px;border-radius:8px}.delivery-address{font-weight:800;margin:7px 0}.delivery-products{font-size:.8rem;color:#486155}.delivery-phone{display:block;margin:6px 0;color:var(--green);font-weight:900}.delivery-actions{margin-top:8px}.delivery-board-actions{display:flex;gap:7px;flex-wrap:wrap}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr}.delivery-grid{grid-template-columns:1fr 1fr}}@media(max-width:680px){.wrap{width:calc(100% - 16px)}.stats{grid-template-columns:1fr 1fr}.product-summary,.toolbar,.form-grid,.product-qty-grid,.delivery-grid{grid-template-columns:1fr}.header-actions{width:100%;flex-wrap:wrap}.header-actions .btn{flex:1}.product-pill{display:none}.table-head{align-items:flex-start;gap:8px;flex-direction:column}}
</style></head><body><div class="wrap"><header><div class="header-row"><div class="brand"><div class="brand-mark"><svg viewBox="0 0 64 64"><path d="M17 18v30M47 18v30M14 48h36" fill="none" stroke="#153b2a" stroke-width="4"/><ellipse cx="26" cy="40" rx="6" ry="8" fill="#fff4a8" stroke="#8f6710" stroke-width="2"/></svg></div><div class="title"><h1>ניהול שוק ארבעת המינים</h1><p>הזמנות, תשלומים ומשלוחים במקום אחד</p></div></div><div class="product-pill">3 סוגי סטים · <span class="price-chip">₪130</span></div><div class="header-actions"><button class="btn btn-primary" onclick="openNewOrder()"><i class="fa-solid fa-plus"></i> הזמנה חדשה</button><button class="btn btn-waze" onclick="openDeliveryBoard()"><i class="fa-solid fa-truck"></i> לוח משלוחים</button><button class="btn btn-excel" onclick="exportExcel(true)"><i class="fa-solid fa-file-excel"></i> Excel</button><button class="btn btn-danger" id="resetAllBtn" onclick="resetAllOrders(this)"><i class="fa-solid fa-trash-can"></i> איפוס</button></div></div></header>
<section class="stats"><div class="stat"><div class="label">סה״כ רשומות</div><div class="value" id="totalOrders">0</div></div><div class="stat today"><div class="label">היום</div><div class="value" id="todayOrders">0</div></div><div class="stat"><div class="label">סה״כ סטים</div><div class="value" id="totalUnits">0</div></div><div class="stat paid"><div class="label">שולם</div><div class="value" id="paidCount">0</div></div><div class="stat unpaid"><div class="label">ממתין לתשלום</div><div class="value" id="pendingCount">0</div></div></section>
<section class="product-summary"><button class="product-stat" data-product-key="sef" onclick="setProductFilter('sef')"><span class="product-stat-name">סט ספרדי<small>מספר הסטים שהוזמנו</small></span><span class="product-stat-value" id="sefUnits">0</span></button><button class="product-stat" data-product-key="ash" onclick="setProductFilter('ash')"><span class="product-stat-name">סט אשכנזי<small>מספר הסטים שהוזמנו</small></span><span class="product-stat-value" id="ashUnits">0</span></button><button class="product-stat" data-product-key="yem" onclick="setProductFilter('yem')"><span class="product-stat-name">סט עם אתרוג תימני<small>מספר הסטים שהוזמנו</small></span><span class="product-stat-value" id="yemUnits">0</span></button></section>
<section class="toolbar"><div class="field"><label>חיפוש</label><input id="search" class="control" placeholder="שם, טלפון, עיר, רחוב או מספר הזמנה" oninput="render()"></div><div class="field"><label>סטטוס תשלום</label><select id="paymentFilter" class="control" onchange="render()"><option value="all">הכול</option><option value="paid">שולם</option><option value="pending">ממתין</option></select></div><div class="field"><label>סוג סט</label><select id="productFilter" class="control" onchange="render()"><option value="all">כל הסטים</option><option value="sef">סט ספרדי</option><option value="ash">סט אשכנזי</option><option value="yem">סט עם אתרוג תימני</option></select></div><div class="field"><label>אופן קבלה</label><select id="shippingFilter" class="control" onchange="render()"><option value="all">הכול</option><option value="איסוף עצמי">איסוף עצמי</option><option value="משלוח">משלוח</option></select></div><button class="btn btn-secondary" onclick="clearFilters()">ניקוי</button></section>
<section class="table-card"><div class="table-head"><div><h2>הזמנות</h2><div class="mini" id="visibleCount">מציג 0</div></div><div class="table-actions"><button class="btn btn-waze" onclick="openDeliveryBoard()"><i class="fa-solid fa-route"></i> לוח משלוחים</button><button class="btn btn-excel" onclick="exportExcel(false)">Excel לפי החיפוש</button></div></div><div class="table-scroll"><table><thead><tr><th>מס׳ קבלה / הזמנה</th><th>תאריך</th><th>לקוח / כתובת</th><th>טלפון</th><th>כמות</th><th>סוג הסט</th><th>קבלה</th><th>סכום</th><th>סטטוס</th><th>הערות</th><th>פעולות</th></tr></thead><tbody id="ordersBody"><tr><td class="empty" colspan="11">טוען הזמנות...</td></tr></tbody></table></div></section></div>
<div class="modal" id="orderModal" onclick="if(event.target===this)closeOrderModal()"><div class="modal-card"><div class="modal-head"><h2>הזמנה</h2><button class="close-btn" onclick="closeOrderModal()">×</button></div><form id="orderForm" class="form-body" onsubmit="saveOrder(event)"><input type="hidden" id="editDocId"><input type="hidden" id="editOrderId"><div class="form-grid"><div class="field"><label>שם לקוח *</label><input id="fName" class="control" required></div><div class="field"><label>טלפון *</label><input id="fPhone" class="control" required></div><div class="field"><label>אימייל</label><input id="fEmail" type="email" class="control"></div><div class="field product-qty-wrap"><label>כמות לפי סוג סט *</label><div class="product-qty-grid"><label class="product-qty-card">סט ספרדי<input id="fQtySef" type="number" min="0" value="1" class="control" oninput="refreshFormTotal()"></label><label class="product-qty-card">סט אשכנזי<input id="fQtyAsh" type="number" min="0" value="0" class="control" oninput="refreshFormTotal()"></label><label class="product-qty-card">סט עם אתרוג תימני<input id="fQtyYem" type="number" min="0" value="0" class="control" oninput="refreshFormTotal()"></label></div></div><div class="field"><label>אופן קבלה</label><select id="fShipping" class="control" onchange="toggleAddress();refreshFormTotal()"><option value="איסוף עצמי">איסוף עצמי</option><option value="משלוח">משלוח (+₪45)</option></select></div><div class="field"><label>תאריך</label><input id="fDate" type="datetime-local" class="control"></div><div class="field address"><label>עיר</label><input id="fCity" class="control"></div><div class="field address"><label>רחוב</label><input id="fStreet" class="control"></div><div class="field address"><label>בית</label><input id="fHouse" class="control"></div><div class="field address"><label>דירה</label><input id="fApartment" class="control"></div><div class="field full"><label>הערות</label><textarea id="fNotes" class="control"></textarea></div><label class="checkline full"><input id="fPaid" type="checkbox"> ההזמנה שולמה</label><div class="unknown-items-note" id="unknownItemsNote"></div><div class="summary-box"><span>סכום ההזמנה</span><strong id="formTotal">₪130</strong></div></div><div class="form-footer"><button id="saveOrderBtn" type="submit" class="btn btn-save">שמירה</button><button type="button" class="btn btn-secondary" onclick="closeOrderModal()">ביטול</button></div></form></div></div>
<div class="modal" id="deliveryBoard" onclick="if(event.target===this)closeDeliveryBoard()"><div class="modal-card delivery-board-card"><div class="modal-head delivery-board-head"><div><h2><i class="fa-solid fa-truck-fast"></i> לוח משלוחים</h2><div>מסודר לפי ערים וכתובות</div></div><div class="delivery-board-actions"><button class="btn btn-excel" onclick="exportDeliveries()"><i class="fa-solid fa-file-excel"></i> הורד טבלת משלוחים</button><button class="btn btn-waze" onclick="openWazeRoute()"><i class="fa-brands fa-waze"></i> התחל מסלול Waze</button><button class="close-btn" onclick="closeDeliveryBoard()">×</button></div></div><div class="delivery-board-body" id="deliveryBoardBody"></div></div></div><div class="toast" id="toast"></div><script type="module" src="firebase-admin.js?v=20260915-2"></script><script src="admin.js?v=20260915-2" defer></script></body></html>
