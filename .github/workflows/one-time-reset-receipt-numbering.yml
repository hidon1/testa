name: One-time reset and receipt numbering
on:
  push:
    paths:
      - '.github/workflows/one-time-reset-receipt-numbering.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/add_reset_receipt_numbering.py
      - run: rm -f .github/workflows/one-time-reset-receipt-numbering.yml .github/scripts/add_reset_receipt_numbering.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          git commit -m "Add full reset and sequential receipt numbering" || exit 0
          git push origin main
